server:
  port: 8080

spring:
  application:
    name: taller-reparaciones

  datasource:
    # H2 en memoria: cada arranque deja una base limpia y vuelve a correr el seed.
    url: jdbc:h2:mem:taller;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
    # Necesario para que data.sql (seed) corra DESPUÉS de que Hibernate cree el esquema.
    defer-datasource-initialization: true

  sql:
    init:
      mode: always

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 20MB

# Carpeta local donde se guardan las fotos subidas (se sirven en /uploads/**)
app:
  uploads:
    dir: uploads
  fotos:
    max-por-orden: 3
  cors:
    # En desarrollo el frontend corre en Vite (5173). Se permiten también los previews.
    allowed-origins: "*"

logging:
  level:
    org.hibernate.SQL: info
